<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <!--
      Offline lockdown. This page may not load or send anything over the network:
      no fetch/XHR/WebSocket, no external scripts/styles/images/fonts, no form posts,
      no navigation of frames. Everything it needs is inlined into this one file.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; worker-src 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Markdown Preview (Offline)</title>
  </head>

  <body>
    <header>
        <div id="menu-items">
            <div class="brand">Markdown Preview <span id="offline-badge" title="Content Security Policy blocks all network access. Content is never saved.">● Offline</span></div>
            <div><button type="button" id="open-button">Open</button></div>
            <input type="file" id="open-file-input" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
            <div><button type="button" id="copy-button">Copy</button></div>
            <div><button type="button" id="export-button">Export PDF</button></div>
            <div><button type="button" id="reset-button">Clear</button></div>
            <div id="sync-button">
              <input type="checkbox" id="sync-scroll-checkbox"><label for="sync-scroll-checkbox">Sync scroll</label>
              <span style="margin-left:12px;"><input type="checkbox" id="theme-checkbox"><label for="theme-checkbox">Dark mode</label></span>
            </div>
        </div>
        <div id="file-name"></div>
    </header>

    <div id="container" class="split-container">
        <div id="edit" class="column editor-pane">
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <div id="split-divider" class="split-divider"></div>

        <div id="preview" class="column preview-pane">
            <div id="preview-wrapper">
                <div id="output" class="content markdown-body"></div>
            </div>
        </div>
    </div>

    <div id="drop-overlay">Drop .md file to open</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
